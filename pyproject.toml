[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quireflow"
version = "0.1.0"
description = "Resumable, page-auditable OCR for large PDFs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Cyrille Rossant"}]
dependencies = ["pypdf>=5.0"]

[project.optional-dependencies]
mistral = ["mistralai==2.9.4"]
dev = ["pytest>=8"]

[project.scripts]
quireflow = "quireflow.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
